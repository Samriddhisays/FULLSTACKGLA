<!DOCTYPE html>
<html>
<head>
    <title>Welcome Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px;
        }

        .container {
            width: 420px;
            margin: auto;
            padding: 25px;
            background-color: white;
            border: 2px solid #d8a67c;
            border-radius: 8px;
        }

        h2 {
            font-size: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.8;
            color: #333;
        }

        .highlight {
            background-color: red;
            color: white;
            padding: 5px 30px;
            margin: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Welcome to page</h2>

        <p>
            Here, some color and other
            <span class="highlight">content</span>
            consists of
        </p>

        <p>
            <span class="highlight">this</span>
            place and different
            properties are
        </p>

        <p>
            Following paragraph shows
            different properties of
            paragraph and other elements.
        </p>

        <p>
            The page contains various
            examples and information.
        </p>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: rgb(255, 255, 255);
            font-family: Georgia, serif;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 35px;
            background-color: #d3ccff;
            border: 3px dashed black;
        }

        .welcome-box {
            background-color: #faff99;
            padding: 25px;
            margin: 20px;
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
            color: #4c358b;
        }

        p {
            font-size: 18px;
            color: #ce06f6;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="welcome-box">

            <h1>Welcome to page</h1>

            <p>
                Here you can find all the important information
                about this page. This is a simple webpage created
                using HTML and CSS.
            </p>

        </div>

    </div>

</body>
</html>
